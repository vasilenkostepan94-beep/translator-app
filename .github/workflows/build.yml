name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fix container ownership
      run: |
        git config --global --add safe.directory /__w/$(echo ${{ github.repository }} | tr 'A-Z' 'a-z' | cut -d'/' -f2)

    - name: Run Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
